# Documentation & specification conformance (stack-independent).
# Stack-specific build/test/scan stages are still required — see README.md in this folder.
name: docs-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs, feature specs and agent assets
        run: python scripts/check_docs.py
      - name: MANIFEST.json is current
        run: python scripts/manifest.py --check
